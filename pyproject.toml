[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "name2smiles-bench"
version = "0.1.0"
description = "A reproducible name-to-SMILES benchmark dataset built from PubChem"
requires-python = ">=3.11"
dependencies = [
    "rdkit",
    "requests",
    "pandas",
    "numpy",
    "tqdm",
    "matplotlib",
    "python-dotenv",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"name2smiles.llm" = ["llm_pricing.json"]

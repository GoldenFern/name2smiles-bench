name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ".[test]"
      - run: python -m pytest tests/
      - name: Check installed pricing resource
        working-directory: /tmp
        run: python -c "from name2smiles.llm import load_pricing; assert len(load_pricing().models) == 20"
